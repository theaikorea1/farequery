name: Monthly FareDB Update

on:
  schedule:
    # 매월 9일 08:00 KST (= 8일 23:00 UTC)
    - cron: '0 23 8 * *'
    # 매월 14일 08:00 KST (= 13일 23:00 UTC) — 9일 미업로드 시 재시도
    - cron: '0 23 13 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '강제 실행 (NO_NEW_DATA여도 계속)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run monthly update
        id: update
        run: |
          cd scraper
          OUTPUT=$(python run_monthly.py 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "result=$(echo "$OUTPUT" | tail -1)" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Check for new data
        id: check
        run: |
          RESULT="${{ steps.update.outputs.result }}"
          echo "Scraper result: $RESULT"
          if echo "$RESULT" | grep -q "NO_NEW_DATA"; then
            echo "has_new_data=false" >> $GITHUB_OUTPUT
          else
            echo "has_new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated CSV
        if: steps.check.outputs.has_new_data == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RESULT="${{ steps.update.outputs.result }}"
          TODAY=$(date +"%Y년 %-m월")

          git add FareDB/kita_all_freight.csv FareDB/kita_sea_freight.csv FareDB/kita_air_freight.csv
          git diff --cached --quiet || \
            git commit -m "data: ${TODAY} 운임 데이터 업데이트 (${RESULT})"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.has_new_data }}" == "true" ]; then
            echo "✅ 신규 데이터 추가 완료: ${{ steps.update.outputs.result }}"
          else
            echo "ℹ️  신규 데이터 없음 (KITA 미업로드 또는 이미 최신)"
          fi
